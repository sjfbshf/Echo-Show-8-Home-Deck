<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;500;650&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="wheel.js"></script>
<style>
  /* A calendar with no sign-in on the Echo: it reads Google Calendar's "secret address in iCal format"
     (listed under "calendars" in settings.json on the PC, copied here by sync_echo.py) plus US holidays.
     Google events are read-only here: change them on your phone or PC and they show up within 30 minutes.
     Events added with "Add" are kept on the Echo itself, and alarm.js rings their reminders on any deck page. */
  :root { --bg:#070b12; --card:#0e1520; --line:rgba(160,190,230,.12); --text:#eef2f8; --dim:#7f8aa0; --accent:#f2b84b; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 50%, #0d1524 0%, var(--bg) 70%);
    color: var(--text); font-family: "Sora", "Segoe UI", Roboto, sans-serif;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 380px); grid-template-rows: 60px minmax(0, 1fr);
    gap: 18px; padding: 22px 26px; overflow: hidden; -webkit-user-select: none; user-select: none; position: relative;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  /* top bar, same on every page */
  .bar { grid-column: 1 / 3; display: flex; align-items: center; gap: 18px; }
  .home { display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 22px 0 18px; font-size: 18px; color: var(--text);
          border: 1px solid var(--line); background: linear-gradient(170deg,#121b28,var(--card)); border-radius: 18px; }
  .home svg { width: 26px; height: 26px; }
  .home:active { border-color: var(--accent); }
  .title { font-size: 22px; font-weight: 500; }
  .side { margin-left: auto; font-size: 15px; color: var(--dim); }
  .panel { border: 1px solid var(--line); border-radius: 24px; background: rgba(14,21,32,.6); padding: 22px 24px; min-height: 0; display: flex; flex-direction: column; }
  .label { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }

  /* month */
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .month { font-size: 34px; font-weight: 300; letter-spacing: -.01em; margin-right: auto; }
  .month b { font-weight: 300; color: var(--dim); }
  .nav { height: 52px; min-width: 52px; padding: 0 18px; border-radius: 14px; border: 1px solid var(--line); background: #121b28; font-size: 22px; }
  .nav.today { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; }
  .nav:active { border-color: var(--accent); }
  .wk { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px; }
  .wk span { font-size: 12px; letter-spacing: .2em; color: var(--dim); padding-left: 10px; }
  .grid { flex: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 5px; min-height: 0; }
  .day { border: 1px solid transparent; border-radius: 12px; background: rgba(160,190,230,.035); padding: 6px 7px; min-width: 0; overflow: hidden; display: flex; flex-direction: column; gap: 3px; text-align: left; }
  .day .n { font-size: 17px; line-height: 26px; width: 30px; text-align: center; border-radius: 13px; margin-left: -2px; }
  .day.out { opacity: .35; }
  .day.today .n { background: var(--accent); color: #1a1205; font-weight: 650; }
  .day.sel { border-color: rgba(242,184,75,.55); background: rgba(242,184,75,.06); }
  .chip { font-size: 12px; line-height: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 6px; border-left: 3px solid var(--c); color: #cdd5e2; }
  .more { font-size: 11px; color: var(--dim); padding-left: 9px; }

  /* agenda for the chosen day onward */
  .agenda { gap: 0; }
  .list { flex: 1; overflow-y: auto; margin-top: 12px; padding-right: 4px; }
  .dh { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin: 16px 0 8px; }
  .dh:first-child { margin-top: 0; }
  .dh.now { color: var(--accent); }
  .ev { display: grid; grid-template-columns: 84px 4px 1fr; gap: 12px; align-items: center; padding: 9px 0; }
  .ev .t { font-size: 15px; color: var(--dim); text-align: right; }
  .ev i { align-self: stretch; border-radius: 2px; background: var(--c); }
  .ev .s { font-size: 19px; line-height: 1.25; }
  .empty { color: var(--dim); font-size: 17px; margin-top: 6px; }
  .note { font-size: 13px; color: var(--dim); line-height: 1.45; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 10px; }
  .note.bad { color: #ff6b6b; }
  .ev.own { cursor: pointer; border-radius: 12px; }
  .ev.own:active { background: rgba(242,184,75,.08); }
  .ev .s small { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--accent); margin-top: 3px; }
  .ev .s small svg { width: 14px; height: 14px; }
  .ahead { display: flex; align-items: center; justify-content: space-between; }
  .add { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 18px 0 14px; border-radius: 14px; font-size: 17px; font-weight: 500;
         color: #1a1205; background: var(--accent); border: 0; }
  .add svg { width: 20px; height: 20px; }
  .add:active { transform: scale(.96); }

  /* the add / edit sheet: name, day, time wheels and when to be reminded */
  .sheet { position: absolute; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: rgba(4,7,12,.72); }
  .sheet[hidden] { display: none; }
  .box { width: 1180px; height: 730px; display: grid; grid-template-columns: minmax(0, 1fr) 420px; grid-template-rows: 64px minmax(0, 1fr) auto; gap: 18px 30px;
         padding: 24px 30px; border-radius: 28px; border: 1px solid var(--line); background: linear-gradient(170deg, #121b28, #0b111b);
         box-shadow: 0 40px 80px -30px #000; animation: rise .35s cubic-bezier(.2,.8,.2,1); }
  @keyframes rise { from { opacity: 0; transform: translateY(26px) scale(.98); } }
  .bh { grid-column: 1 / 3; display: flex; align-items: center; gap: 14px; }
  .bh h2 { font-size: 26px; font-weight: 500; margin-right: auto; }
  .btn { height: 56px; padding: 0 26px; border-radius: 16px; font-size: 19px; border: 1px solid var(--line); background: #121b28; }
  .btn:active { border-color: var(--accent); }
  .btn.save { color: #1a1205; background: var(--accent); border-color: var(--accent); font-weight: 500; }
  .btn.del { color: #ff6b6b; }
  .col { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .name { height: 66px; border-radius: 16px; border: 1px solid var(--line); background: rgba(4,7,12,.5); color: var(--text); font: inherit; font-size: 24px; padding: 0 20px; outline: none; }
  .name:focus { border-color: rgba(242,184,75,.6); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { height: 48px; padding: 0 18px; border-radius: 14px; font-size: 17px; border: 1px solid var(--line); background: #121b28; color: #cdd5e2; }
  .chips button.on { color: var(--accent); border-color: rgba(242,184,75,.6); background: rgba(242,184,75,.1); }
  .chips button:active { transform: scale(.96); }
  .dayrow { display: flex; align-items: center; gap: 10px; }
  .dayrow .d { flex: 1; text-align: center; font-size: 26px; font-weight: 300; }
  .dayrow .d b { display: block; font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); font-weight: 500; margin-bottom: 4px; }
  .dayrow .nav { height: 64px; min-width: 64px; font-size: 28px; }
  .space { flex: 1; }
  .sum { font-size: 17px; color: var(--dim); line-height: 1.45; }
  .sum b { color: var(--text); font-weight: 500; }
  .remind { grid-column: 1 / 3; display: flex; align-items: center; gap: 16px; border-top: 1px solid var(--line); padding-top: 16px; }
  .remind .label { flex: none; }

  /* time wheels (wheel.js), same as the timer's but a bit smaller */
  .wheels { --row: 62px; display: flex; align-items: center; justify-content: center; gap: 6px; position: relative; flex: 1; }
  .band { position: absolute; left: 6px; right: 6px; top: 50%; height: var(--row); margin-top: calc(var(--row) / -2);
          border-radius: 16px; border: 1px solid rgba(242,184,75,.35); background: rgba(242,184,75,.06); pointer-events: none; }
  .wheel { position: relative; height: calc(var(--row) * 5); width: 112px; overflow-y: scroll; scrollbar-width: none;
           scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
           -webkit-mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent); }
  .wheel::-webkit-scrollbar { display: none; }
  .wheel.ampm { width: 96px; }
  .wheel div { height: var(--row); display: flex; align-items: center; justify-content: center; scroll-snap-align: center;
               font-size: 40px; font-weight: 300; font-variant-numeric: tabular-nums; color: #4c566a; transition: color .15s, font-size .15s; }
  .wheel.ampm div { font-size: 28px; }
  .wheel div.near { color: var(--dim); }
  .wheel div.mid { color: var(--text); font-size: 50px; font-weight: 500; }
  .wheel.ampm div.mid { font-size: 32px; }
  .colon { font-size: 44px; color: #4c566a; margin-bottom: 6px; position: relative; z-index: 1; }
</style>
</head>
<body>
  <div class="bar">
    <button class="home" id="home" aria-label="Back to deck" onclick="location.href='index.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Deck
    </button>
    <div class="title">Calendar</div>
    <div class="side" id="side"></div>
  </div>

  <section class="panel" aria-label="Month">
    <div class="top">
      <div class="month" id="month"></div>
      <button class="nav today" id="today">Today</button>
      <button class="nav" id="prev" aria-label="Previous month">&#8249;</button>
      <button class="nav" id="next" aria-label="Next month">&#8250;</button>
    </div>
    <div class="wk"><span>SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span></div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="panel agenda" aria-label="Events">
    <div class="ahead">
      <div class="label" id="agendaLabel">Coming up</div>
      <button class="add" id="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add</button>
    </div>
    <div class="list" id="list"></div>
    <div class="note" id="note"></div>
  </section>

  <div class="sheet" id="sheet" hidden>
    <div class="box" role="dialog" aria-label="Event">
      <div class="bh">
        <h2 id="sTitle">New event</h2>
        <button class="btn del" id="sDel">Delete</button>
        <button class="btn" id="sCancel">Cancel</button>
        <button class="btn save" id="sSave">Save</button>
      </div>
      <div class="col">
        <div class="label">What</div>
        <input class="name" id="sName" maxlength="60" placeholder="Name it, or tap one below" autocomplete="off">
        <div class="chips" id="sNames"></div>
        <div class="label" style="margin-top:10px">Day</div>
        <div class="dayrow">
          <button class="nav" id="sPrev" aria-label="Day before">&#8249;</button>
          <div class="d" id="sDay"></div>
          <button class="nav" id="sNext" aria-label="Day after">&#8250;</button>
        </div>
        <div class="space"></div>
        <div class="sum" id="sSum"></div>
      </div>
      <div class="col">
        <div class="label">Time</div>
        <div class="wheels"><div class="band"></div>
          <div class="wheel" id="eH"></div><div class="colon">:</div>
          <div class="wheel" id="eM"></div>
          <div class="wheel ampm" id="eP"></div>
        </div>
      </div>
      <div class="remind">
        <div class="label">Remind me</div>
        <div class="chips" id="sRemind"></div>
      </div>
    </div>
  </div>

<script>
  var DECK = window.DECK || {};
  var DAY = 86400000;
  var FEEDS = [{ url: "https://calendar.google.com/calendar/ical/en.usa%23holiday%40group.v.calendar.google.com/public/basic.ics", c: "#5fd39a" }]
    .concat((DECK.calendars || []).map(function (u, i) { return { url: u, c: ["#6fa8ff", "#a882ff", "#ff9f6b", "#6fd3ff"][i % 4], mine: true }; }));
  var EVENTS = [], failed = [], updated = null;

  // ---------- reading iCal (.ics) ----------
  var WD = { SU: 0, MO: 1, TU: 2, WE: 3, TH: 4, FR: 5, SA: 6 }, fmts = {};
  function tzAhead(t, tz) {  // how far the time zone is ahead of UTC at instant t, in ms
    var f = fmts[tz] || (fmts[tz] = new Intl.DateTimeFormat("en-US", { timeZone: tz, hourCycle: "h23", year: "numeric", month: "numeric", day: "numeric", hour: "numeric", minute: "numeric", second: "numeric" }));
    var p = {}; f.formatToParts(new Date(t)).forEach(function (x) { p[x.type] = +x.value; });
    return Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second) - Math.floor(t / 1000) * 1000;
  }
  function parseDate(v, tz) {
    var m = /^(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d)(\d\d)(Z)?)?/.exec(v);
    if (!m) return { d: new Date(NaN) };
    if (!m[4]) return { d: new Date(+m[1], m[2] - 1, +m[3]), allDay: true };
    var wall = Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]);
    if (m[7]) return { d: new Date(wall) };
    if (tz) try { return { d: new Date(wall - tzAhead(wall - tzAhead(wall, tz), tz)) }; } catch (e) {}  // unknown zone names fall through to local time
    return { d: new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]) };
  }
  function parseICS(text, c) {
    var out = [], cur = null;
    text.replace(/\r?\n[ \t]/g, "").split(/\r?\n/).forEach(function (line) {
      if (line === "BEGIN:VEVENT") cur = { ex: [], skip: {}, c: c };
      else if (line === "END:VEVENT") { if (cur && cur.start && !isNaN(cur.start)) out.push(cur); cur = null; }
      else if (cur) {
        var i = line.indexOf(":"); if (i < 0) return;
        var head = line.slice(0, i).split(";"), val = line.slice(i + 1), tz = (/;TZID="?([^;:"]+)/.exec(line.slice(0, i)) || [])[1];
        switch (head[0]) {
          case "SUMMARY": cur.title = val.replace(/\\n/gi, " ").replace(/\\([,;\\])/g, "$1"); break;
          case "DTSTART": var p = parseDate(val, tz); cur.start = p.d; cur.allDay = p.allDay; break;
          case "DTEND": cur.end = parseDate(val, tz).d; break;
          case "RRULE": cur.rule = {}; val.split(";").forEach(function (kv) { kv = kv.split("="); cur.rule[kv[0]] = kv[1]; }); break;
          case "EXDATE": val.split(",").forEach(function (v) { cur.ex.push(+parseDate(v, tz).d); }); break;
          case "RECURRENCE-ID": cur.recId = +parseDate(val, tz).d; break;
          case "UID": cur.uid = val; break;
          case "STATUS": cur.status = val; break;
        }
      }
    });
    // a changed or cancelled single occurrence of a repeating event replaces that occurrence;
    // cancelled ones are only dropped after they've taken their slot out of the series
    var byUid = {}; out.forEach(function (e) { if (e.rule) byUid[e.uid] = e; });
    out.forEach(function (e) { if (e.recId && byUid[e.uid]) byUid[e.uid].skip[e.recId] = 1; });
    return out.filter(function (e) { return e.status !== "CANCELLED"; });
  }

  // ---------- repeating events ----------
  // shortcut: covers DAILY/WEEKLY/MONTHLY/YEARLY with INTERVAL, COUNT, UNTIL, BYDAY (incl. "2TU", "-1FR"), BYMONTHDAY, BYMONTH.
  // BYSETPOS and hourly rules are not handled; repeats keep the first event's clock time in the Echo's time zone.
  function dayNo(d) { return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY); }
  function fromDayNo(n, t) { var u = new Date(n * DAY); return new Date(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate(), t.getHours(), t.getMinutes(), t.getSeconds()); }
  function list(v, f) { return v ? v.split(",").map(f || Number) : null; }
  function fits(r, s, d, sn, dn) {
    var iv = +(r.INTERVAL || 1), wd = d.getDay(), dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    var byday = list(r.BYDAY, function (x) { var m = /^([+-]?\d+)?([A-Z]{2})$/.exec(x); return { n: +(m[1] || 0), wd: WD[m[2]] }; });
    var bymd = list(r.BYMONTHDAY), bymo = list(r.BYMONTH);
    if (bymo && bymo.indexOf(d.getMonth() + 1) < 0) return false;
    function onDay() { return byday.some(function (b) { return b.wd === wd && (!b.n || (b.n > 0 ? Math.ceil(d.getDate() / 7) === b.n : Math.ceil((dim - d.getDate() + 1) / 7) === -b.n)); }); }
    function onDate(def) { return (bymd || [def]).some(function (m) { return d.getDate() === (m > 0 ? m : dim + m + 1); }); }
    var months = (d.getFullYear() - s.getFullYear()) * 12 + d.getMonth() - s.getMonth();
    switch (r.FREQ) {
      case "DAILY": return (dn - sn) % iv === 0 && (!byday || onDay());
      case "WEEKLY":
        var ws = WD[r.WKST || "MO"], w0 = sn - (s.getDay() - ws + 7) % 7, w1 = dn - (wd - ws + 7) % 7;
        return ((w1 - w0) / 7) % iv === 0 && (byday ? onDay() : wd === s.getDay());
      case "MONTHLY": return months % iv === 0 && (byday ? onDay() && (!bymd || onDate()) : onDate(s.getDate()));
      case "YEARLY":
        if ((d.getFullYear() - s.getFullYear()) % iv || (!bymo && d.getMonth() !== s.getMonth())) return false;
        return byday ? onDay() : onDate(s.getDate());
    }
    return false;
  }
  // every occurrence of an event that overlaps [from, to)
  function occurrences(e, from, to) {
    var len = e.end ? e.end - e.start : (e.allDay ? DAY : 0), out = [];
    function add(s) { if (+s < +to && +s + Math.max(len, 1) > +from) out.push({ s: s, e: new Date(+s + len), ev: e }); }
    if (!e.rule) { add(e.start); return out; }
    var r = e.rule, sn = dayNo(e.start), max = r.COUNT ? +r.COUNT : Infinity, count = 0;
    var until = r.UNTIL ? parseDate(r.UNTIL).d : null; if (until && r.UNTIL.length === 8) until = new Date(+until + DAY - 1);
    var n = r.COUNT ? sn : Math.max(sn, dayNo(from) - Math.ceil(len / DAY) - 1);  // with COUNT we must count from the first one
    for (var end = dayNo(to); n <= end && count < max; n++) {
      var d = fromDayNo(n, e.start);
      if (until && d > until) break;
      if (!fits(r, e.start, d, sn, n)) continue;
      count++;
      if (e.ex.indexOf(+d) < 0 && !e.skip[+d]) add(d);
    }
    return out;
  }
  function between(from, to) {
    var all = [];
    EVENTS.forEach(function (e) { all = all.concat(occurrences(e, from, to)); });
    return all.sort(function (a, b) { return (b.ev.allDay ? 1 : 0) - (a.ev.allDay ? 1 : 0) || a.s - b.s; });
  }
  function onDay(occ, day) {  // occurrences touching this local day
    var a = +day, b = +new Date(day.getFullYear(), day.getMonth(), day.getDate() + 1);
    return occ.filter(function (o) { return +o.s < b && (+o.e > a || (+o.s >= a && +o.e === +o.s)); });
  }

  // ---------- drawing ----------
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var view = new Date(today.getFullYear(), today.getMonth(), 1), sel = new Date(today);
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function same(a, b) { return +a === +b; }
  function time(d) { return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }

  function draw() {
    today = new Date(); today.setHours(0, 0, 0, 0);
    document.getElementById("month").innerHTML = view.toLocaleDateString([], { month: "long" }) + " <b>" + view.getFullYear() + "</b>";
    var first = new Date(view.getFullYear(), view.getMonth(), 1 - view.getDay());
    var weeks = Math.ceil((view.getDay() + new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate()) / 7);
    var last = new Date(first.getFullYear(), first.getMonth(), first.getDate() + weeks * 7);
    var occ = between(first, last), grid = document.getElementById("grid");
    grid.innerHTML = "";
    for (var i = 0; i < weeks * 7; i++) {
      var d = new Date(first.getFullYear(), first.getMonth(), first.getDate() + i), mine = onDay(occ, d);
      var cell = el("button", "day" + (d.getMonth() !== view.getMonth() ? " out" : "") + (same(d, today) ? " today" : "") + (same(d, sel) ? " sel" : ""));
      cell.appendChild(el("span", "n", d.getDate()));
      var room = weeks > 5 ? 2 : 3;
      mine.slice(0, mine.length > room ? room - 1 : room).forEach(function (o) { var c = el("div", "chip", o.ev.title || "(busy)"); c.style.setProperty("--c", o.ev.c); cell.appendChild(c); });
      if (mine.length > room) cell.appendChild(el("div", "more", "+" + (mine.length - room + 1) + " more"));
      cell.onclick = (function (day) { return function () { sel = day; if (day.getMonth() !== view.getMonth()) view = new Date(day.getFullYear(), day.getMonth(), 1); draw(); }; })(d);
      grid.appendChild(cell);
    }
    drawAgenda();
  }

  function drawAgenda() {
    var to = new Date(sel.getFullYear(), sel.getMonth(), sel.getDate() + 14), occ = between(sel, to), box = document.getElementById("list");
    document.getElementById("agendaLabel").textContent = same(sel, today) ? "Coming up" : "From " + sel.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
    box.innerHTML = "";
    for (var i = 0; i < 14; i++) {
      var d = new Date(sel.getFullYear(), sel.getMonth(), sel.getDate() + i), mine = onDay(occ, d);
      if (!mine.length && i) continue;
      var diff = Math.round((d - today) / DAY);
      var name = diff === 0 ? "Today" : diff === 1 ? "Tomorrow" : d.toLocaleDateString([], { weekday: "long" });
      box.appendChild(el("div", "dh" + (diff === 0 ? " now" : ""), name + " · " + d.toLocaleDateString([], { month: "short", day: "numeric" })));
      if (!mine.length) box.appendChild(el("div", "empty", "Nothing planned"));
      mine.forEach(function (o) {
        var row = el("div", "ev" + (o.ev.own ? " own" : "")); row.style.setProperty("--c", o.ev.c);
        row.appendChild(el("span", "t", o.ev.allDay || o.s < d ? "All day" : time(o.s)));
        row.appendChild(el("i"));
        var s = row.appendChild(el("span", "s", o.ev.title || "(busy)"));
        if (o.ev.own) {  // your own events: tap to change; shows when it reminds you
          var r = o.ev.own.remind;
          if (r >= 0) { var sm = s.appendChild(el("small")); sm.innerHTML = BELL; sm.appendChild(document.createTextNode(remindText(r))); }
          row.onclick = (function (e) { return function () { openSheet(e); }; })(o.ev.own);
        }
        box.appendChild(row);
      });
    }
    if (box.children.length <= 2 && !box.querySelector(".ev")) box.appendChild(el("div", "empty", "Nothing in the next two weeks."));
    document.getElementById("side").textContent = updated ? "Updated " + time(updated) : "";
    var note = document.getElementById("note");
    note.className = "note" + (failed.length ? " bad" : "");
    note.textContent = failed.length ? "Couldn't update " + failed.join(" and ") + ". Showing the last copy."
      : FEEDS.some(function (f) { return f.mine; }) ? "Your Google Calendar and US holidays. Updates every 30 minutes."
      : "Showing US holidays. To show your own Google Calendar here, add its secret iCal address to settings.json on your PC (see the README).";
  }

  // ---------- loading (kept in localStorage, so the last copy shows even without internet) ----------
  // each feed's copy is stored under a fingerprint of its address, so swapping a calendar in settings.json
  // never shows the old one's events; copies of feeds that were removed are deleted
  function slot(url) { var h = 5381; for (var i = 0; i < url.length; i++) h = (h * 33 ^ url.charCodeAt(i)) >>> 0; return "deckCal:" + h.toString(36) + ":" + url.length; }
  (function tidy() {
    var keep = {}; FEEDS.forEach(function (f) { keep[slot(f.url)] = 1; });
    for (var i = localStorage.length - 1; i >= 0; i--) { var k = localStorage.key(i); if (/^deckCal/.test(k) && !keep[k]) localStorage.removeItem(k); }
  })();
  function rebuild() {
    EVENTS = [];
    FEEDS.forEach(function (f) { var t = localStorage.getItem(slot(f.url)); if (t) EVENTS = EVENTS.concat(parseICS(t, f.c)); });
    mineList().forEach(function (e) { EVENTS.push({ title: e.title, start: new Date(e.at), c: "#f2b84b", ex: [], skip: {}, own: e }); });
    draw();
  }

  // ---------- your own events (kept on the Echo in localStorage "deckEvents") ----------
  // each is { id, title, at: start time in ms, remind: minutes before (-1 = no reminder), fired }
  // alarm.js reads the same list and rings each reminder once, on whichever deck page is open
  var BELL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg>';
  var REMIND = [[-1, "None"], [0, "At the start"], [10, "10 min"], [30, "30 min"], [60, "1 hr"], [120, "2 hr"], [1440, "1 day"]];
  var NAMES = ["Meeting", "Appointment", "Call", "Class", "Practice", "Birthday", "Take medicine"];
  function mineList() { try { return JSON.parse(localStorage.getItem("deckEvents") || "[]"); } catch (e) { return []; } }
  function saveMine(list) { localStorage.setItem("deckEvents", JSON.stringify(list)); }
  function remindText(m) {
    return m === 0 ? "Reminds you when it starts" : "Reminds you " + (m >= 1440 ? m / 1440 + " day" : m >= 60 ? m / 60 + " hr" : m + " min") + " before";
  }

  var ed = null;  // the event being edited: { id, title, day (Date), min (minutes after midnight), remind }
  var eH = Wheel(document.getElementById("eH"), range(12, function (i) { return String(i + 1); }), function (i) { var h = Math.floor(ed.min / 60); ed.min = ((i + 1) % 12 + (h >= 12 ? 12 : 0)) * 60 + ed.min % 60; drawSheet(); }, 62);
  var eM = Wheel(document.getElementById("eM"), range(12, function (i) { return ("0" + i * 5).slice(-2); }), function (i) { ed.min = Math.floor(ed.min / 60) * 60 + i * 5; drawSheet(); }, 62);
  var eP = Wheel(document.getElementById("eP"), ["AM", "PM"], function (i) { var h = Math.floor(ed.min / 60) % 12; ed.min = (h + (i ? 12 : 0)) * 60 + ed.min % 60; drawSheet(); }, 62);
  function range(n, f) { var a = []; for (var i = 0; i < n; i++) a.push(f(i)); return a; }

  NAMES.forEach(function (n) {
    var b = el("button", "", n);
    b.onclick = function () { document.getElementById("sName").value = n; drawSheet(); };
    document.getElementById("sNames").appendChild(b);
  });
  REMIND.forEach(function (r) {
    var b = el("button", "", r[1] + (r[0] > 0 ? " before" : ""));
    b.dataset.m = r[0];
    b.onclick = function () { ed.remind = r[0]; drawSheet(); };
    document.getElementById("sRemind").appendChild(b);
  });

  function openSheet(e) {  // e = one of your events, or nothing for a new one on the chosen day
    if (e) { var at = new Date(e.at); ed = { id: e.id, rang: e.fired && e.remind >= 0, day: new Date(at.getFullYear(), at.getMonth(), at.getDate()), min: at.getHours() * 60 + at.getMinutes(), remind: e.remind }; }
    else {
      var now = new Date(), next = Math.min(23 * 60 + 55, Math.ceil((now.getHours() * 60 + now.getMinutes() + 1) / 30) * 30);  // next half hour
      ed = { id: null, day: new Date(sel), min: same(sel, today) ? next : 9 * 60, remind: 60 };
    }
    document.getElementById("sName").value = e ? e.title : "";
    document.getElementById("sTitle").textContent = e ? "Change event" : "New event";
    document.getElementById("sDel").hidden = !e;
    document.getElementById("sheet").hidden = false;
    var h = Math.floor(ed.min / 60);
    eH.set((h % 12 || 12) - 1); eM.set(Math.round(ed.min % 60 / 5) % 12); eP.set(h >= 12 ? 1 : 0);
    drawSheet();
  }
  function startOf() { return new Date(ed.day.getFullYear(), ed.day.getMonth(), ed.day.getDate(), Math.floor(ed.min / 60), ed.min % 60); }
  function drawSheet() {
    var diff = Math.round((ed.day - today) / DAY), at = startOf();
    document.getElementById("sDay").innerHTML = "<b>" + (diff === 0 ? "Today" : diff === 1 ? "Tomorrow" : diff === -1 ? "Yesterday" : at.toLocaleDateString([], { weekday: "long" })) + "</b>" +
      at.toLocaleDateString([], { month: "long", day: "numeric", year: at.getFullYear() === today.getFullYear() ? undefined : "numeric" });
    var name = document.getElementById("sName").value.trim();
    Array.prototype.forEach.call(document.querySelectorAll("#sNames button"), function (b) { b.classList.toggle("on", b.textContent === name); });
    Array.prototype.forEach.call(document.querySelectorAll("#sRemind button"), function (b) { b.classList.toggle("on", +b.dataset.m === ed.remind); });
    var when = at.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }) + " at " + time(at), ring = new Date(+at - ed.remind * 60000);
    document.getElementById("sSum").innerHTML = "<b>" + (name ? esc(name) : "Your event") + "</b> · " + when + "<br>" +
      (ed.remind < 0 ? "No reminder" : +ring <= Date.now() ? (ed.rang ? "Already reminded you" : "That reminder time has already passed, so it won't ring")
        : "The deck rings " + (ring.toDateString() === at.toDateString() ? "at " + time(ring) : ring.toLocaleDateString([], { weekday: "short" }) + " at " + time(ring)) + (ed.remind ? ", " + REMIND.filter(function (r) { return r[0] === ed.remind; })[0][1] + " before" : ""));
  }
  function esc(t) { return t.replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function closeSheet() { document.getElementById("sheet").hidden = true; document.getElementById("sName").blur(); ed = null; }
  document.getElementById("add").onclick = function () { openSheet(null); };
  document.getElementById("sCancel").onclick = closeSheet;
  document.getElementById("sName").oninput = drawSheet;
  document.getElementById("sPrev").onclick = function () { ed.day = new Date(ed.day.getFullYear(), ed.day.getMonth(), ed.day.getDate() - 1); drawSheet(); };
  document.getElementById("sNext").onclick = function () { ed.day = new Date(ed.day.getFullYear(), ed.day.getMonth(), ed.day.getDate() + 1); drawSheet(); };
  document.getElementById("sSave").onclick = function () {
    var list = mineList(), at = +startOf(), name = document.getElementById("sName").value.trim() || "Event";
    var e = { id: ed.id || String(Date.now()), title: name, at: at, remind: ed.remind, fired: ed.remind < 0 || at - ed.remind * 60000 <= Date.now() };  // a reminder time that's already gone never rings
    list = list.filter(function (x) { return x.id !== e.id; }).concat([e]).sort(function (a, b) { return a.at - b.at; });
    saveMine(list);
    sel = new Date(ed.day); view = new Date(sel.getFullYear(), sel.getMonth(), 1);
    closeSheet(); rebuild();
  };
  document.getElementById("sDel").onclick = function () {
    var id = ed.id; saveMine(mineList().filter(function (x) { return x.id !== id; })); closeSheet(); rebuild();
  };
  // a reminder rang on this page (alarm.js marked it): redraw so nothing is stale
  addEventListener("deckreminder", function () { if (!ed) rebuild(); });
  function load() {
    failed = [];
    var left = FEEDS.length;
    FEEDS.forEach(function (f, i) {
      fetch(f.url).then(function (r) { if (!r.ok) throw r; return r.text(); })
        .then(function (t) { if (t.indexOf("BEGIN:VCALENDAR") < 0) throw t; localStorage.setItem(slot(f.url), t); })
        .catch(function () { failed.push(f.mine ? "your calendar" : "holidays"); })
        .then(function () { if (!--left) { if (failed.length < FEEDS.length) updated = new Date(); rebuild(); } });
    });
  }
  document.getElementById("prev").onclick = function () { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); draw(); };
  document.getElementById("next").onclick = function () { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); draw(); };
  document.getElementById("today").onclick = function () { sel = new Date(today); view = new Date(today.getFullYear(), today.getMonth(), 1); draw(); };
  rebuild(); load();
  setInterval(load, 30 * 60000);

  // timer and alarm keep running (and ring) on this page too
  var js = document.createElement("script"); js.src = "alarm.js"; document.body.appendChild(js);

  // same fit as the deck: designed at 1280x800, shrunk to the Echo's ~853x533
  function fit() {
    var s = document.body.style, z = Math.min(innerWidth / 1280, innerHeight / 800);
    s.zoom = z < 1 ? z : ""; s.width = z < 1 ? "1280px" : ""; s.height = z < 1 ? "800px" : "";
  }
  fit(); addEventListener("resize", fit);
</script>
</body>
</html>
