<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
<title>Claude usage</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;500;650&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="alarm.js"></script>
<style>
  /* Claude usage in depth: opened by tapping the usage panel on the deck. Every limit your plan has (model-specific
     ones like Fable or Opus appear when your plan has them), the last 7 days as a chart, where this week's usage
     went, and usage credits. The numbers come from the PC helper, which asks Anthropic every 5 minutes. */
  :root { --bg:#070b12; --card:#0e1520; --line:rgba(160,190,230,.12); --text:#eef2f8; --dim:#8a95aa; --faint:#5a6478;
          --claude:#d97757; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
          --ok:#5fd39a; --warn:#f2b84b; --bad:#ff6b6b; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 40%, #0d1524 0%, var(--bg) 70%);
    color: var(--text); font-family: "Sora", "Segoe UI", Roboto, sans-serif;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); grid-template-rows: 60px minmax(0, 1fr) minmax(0, 1fr);
    gap: 18px; padding: 22px 26px; -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .bar { grid-column: 1 / 3; display: flex; align-items: center; gap: 18px; }
  .home { display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 22px 0 18px; font-size: 18px;
          border: 1px solid var(--line); background: linear-gradient(170deg,#121b28,var(--card)); border-radius: 18px; }
  .home svg { width: 26px; height: 26px; }
  .home:active { border-color: var(--claude); }
  .title { font-size: 22px; font-weight: 500; display: flex; align-items: center; gap: 10px; }
  .title img { width: 26px; height: 26px; }
  .side { margin-left: auto; font-size: 15px; color: var(--dim); }
  .panel { border: 1px solid var(--line); border-radius: 24px; background: rgba(14,21,32,.6); padding: 20px 24px; min-height: 0; min-width: 0;
           display: flex; flex-direction: column; gap: 12px; }
  .label { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
  .note { font-size: 13px; color: var(--faint); line-height: 1.45; }

  /* the reveal: panels rise in one after another, numbers count up, bars grow */
  .panel { opacity: 0; transform: translateY(14px); animation: rise .7s cubic-bezier(.2,.8,.2,1) forwards; }
  .panel:nth-of-type(2) { animation-delay: .08s; } .panel:nth-of-type(3) { animation-delay: .16s; } .panel:nth-of-type(4) { animation-delay: .24s; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  /* right now: the two numbers that matter most */
  .now { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .big { font-size: 64px; font-weight: 300; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .big small { font-size: 24px; color: var(--dim); margin-left: 2px; }
  .meter { height: 10px; border-radius: 5px; background: rgba(160,190,230,.1); overflow: hidden; margin: 10px 0 8px; }
  .meter i { display: block; height: 100%; width: 100%; border-radius: 5px; background: var(--claude); transform-origin: 0 50%;
             transform: scaleX(0); transition: transform 1s cubic-bezier(.2,.8,.2,1); }
  .meter.warn i { background: var(--warn); } .meter.bad i { background: var(--bad); }
  .reset { font-size: 15px; } .reset span { display: block; font-size: 13px; color: var(--dim); margin-top: 2px; }

  /* every limit */
  .limits { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  .lim { display: grid; grid-template-columns: 1fr 120px 48px; gap: 12px; align-items: center; font-size: 15px; }
  .lim .meter { margin: 0; height: 8px; }
  .lim b { font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
  .lim .who small { display: block; font-size: 12px; color: var(--dim); }
  .chip { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border-radius: 8px; border: 1px solid; margin-left: 6px; vertical-align: 2px; }
  .chip.warning { color: var(--warn); } .chip.serious, .chip.critical { color: var(--bad); }

  /* the 7-day chart */
  .chart { position: relative; flex: 1; min-height: 0; }
  .chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .chart .grid line { stroke: rgba(160,190,230,.1); stroke-width: 1; }
  .chart .axis text { font: 12px Sora, sans-serif; fill: var(--faint); }
  .chart .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .cross { stroke: rgba(238,242,248,.4); stroke-width: 1; }
  .tip { position: absolute; pointer-events: none; padding: 8px 12px; border-radius: 12px; font-size: 13px; line-height: 1.5;
         background: #18212f; border: 1px solid var(--line); box-shadow: 0 10px 24px -12px #000; white-space: nowrap; display: none; }
  .tip i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: 3px; }
  .legend { display: flex; gap: 18px; font-size: 13px; color: var(--dim); }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: 3px; }
  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--dim); font-size: 15px; padding: 0 30px; }

  /* where the week went: one bar split into parts, 2px gaps between them */
  .split { display: flex; gap: 2px; height: 22px; border-radius: 6px; overflow: hidden; }
  .split i { display: block; height: 100%; transform-origin: 0 50%; }
  .keys { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; font-size: 15px; }
  .keys div { display: flex; align-items: center; gap: 8px; }
  .keys i { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .keys b { margin-left: auto; font-weight: 500; font-variant-numeric: tabular-nums; }
  .keys small { color: var(--dim); font-size: 12px; margin-left: 6px; }

  /* credits */
  .credits { display: flex; align-items: baseline; gap: 14px; }
  .credits .big { font-size: 52px; }
  .credits span { font-size: 15px; color: var(--dim); }
</style>
</head>
<body>
  <div class="bar">
    <button class="home" onclick="location.href='index.html'" aria-label="Back to deck">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Deck
    </button>
    <div class="title"><img src="https://api.iconify.design/logos/claude-icon.svg" alt="">Claude usage</div>
    <div class="side" id="side"></div>
  </div>

  <section class="panel">
    <div class="label">Right now</div>
    <div class="now">
      <div id="nowSession"></div>
      <div id="nowWeek"></div>
    </div>
  </section>

  <section class="panel" style="grid-row: 2 / 4; grid-column: 2;">
    <div class="label">The last 7 days</div>
    <div class="legend"><span><i style="background:var(--s1)"></i>This week</span><span><i style="background:var(--s2)"></i>5-hour session</span></div>
    <div class="chart" id="chart"><div class="tip" id="tip"></div></div>
    <div class="label" style="margin-top:6px">Where this week went</div>
    <div class="split" id="split"></div>
    <div class="keys" id="keys"></div>
  </section>

  <section class="panel">
    <div class="label">All your limits</div>
    <div class="limits" id="limits"></div>
    <div class="label" style="margin-top:4px">Usage credits</div>
    <div id="credits"></div>
  </section>

<script>
  var DECK = window.DECK || {};
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function inText(ms) {
    var m = Math.max(0, Math.round(ms / 60000)), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60);
    return d ? d + "d " + h + "h" : h ? h + "h " + (m % 60) + "m" : (m % 60) + "m";
  }
  function when(t) {
    var d = new Date(t), time = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    return d.toDateString() === new Date().toDateString() ? time : d.toLocaleDateString([], { weekday: "short" }) + " " + time;
  }
  function level(p, sev) { return sev === "critical" || sev === "serious" || p >= 90 ? " bad" : sev === "warning" || p >= 75 ? " warn" : ""; }
  // numbers count up from 0 when the screen opens
  function countUp(node, to, suffix) {
    var t0 = performance.now();
    (function step(t) {
      var f = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - f, 3);
      node.innerHTML = Math.round(to * e) + (suffix || "");
      if (f < 1) requestAnimationFrame(step);
    })(t0);
  }
  function grow(meter, p) { requestAnimationFrame(function () { requestAnimationFrame(function () { meter.querySelector("i").style.transform = "scaleX(" + Math.min(1, p / 100) + ")"; }); }); }

  // a limit's name, in words. Anthropic names them by kind ("session", "weekly_all") and, for limits on one model,
  // by scope ("fable", "opus"...); those appear here as soon as your plan has them.
  function nameOf(x) {
    var scope = x.scope ? String(x.scope).replace(/[_-]+/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); }) : "";
    if (x.kind === "session") return "5-hour session";
    if (x.kind === "weekly_all") return "Weekly · all models";
    var base = /week/.test(x.kind || x.group || "") ? "Weekly" : /month/.test(x.kind || "") ? "Monthly" : (x.group || x.kind || "Limit");
    var pretty = String(base).replace(/[_-]+/g, " ").replace(/^\w/, function (c) { return c.toUpperCase(); });
    var model = scope || String(x.kind || "").replace(/^weekly_?/, "").replace(/[_-]+/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); });
    return model && model !== pretty ? pretty + " · " + model : pretty;
  }

  function drawNow(u) {
    [["nowSession", "5-hour session", u.five_hour], ["nowWeek", "This week", u.weekly]].forEach(function (r) {
      var box = $(r[0]), w = r[2]; box.innerHTML = "";
      box.appendChild(el("div", "label", r[1]));
      var big = box.appendChild(el("div", "big"));
      if (!w) { big.textContent = "–"; return; }
      var gone = w.resets_at && Date.parse(w.resets_at) <= Date.now(), p = gone ? 0 : Math.round(w.percent);
      countUp(big, p, "<small>%</small>");
      var m = box.appendChild(el("div", "meter" + level(p))); m.appendChild(el("i")); grow(m, p);
      var reset = box.appendChild(el("div", "reset", !w.resets_at ? "Not started" : gone ? "Reset" : "Resets " + when(w.resets_at)));
      reset.appendChild(el("span", "", !w.resets_at ? "starts when you next use Claude" : gone ? "" : "in " + inText(Date.parse(w.resets_at) - Date.now())));
    });
  }

  function drawLimits(u) {
    var box = $("limits"); box.innerHTML = "";
    var list = u.limits && u.limits.length ? u.limits : [{ kind: "session", percent: (u.five_hour || {}).percent, resets_at: (u.five_hour || {}).resets_at },
                                                        { kind: "weekly_all", percent: (u.weekly || {}).percent, resets_at: (u.weekly || {}).resets_at }];
    list.forEach(function (x) {
      var gone = x.resets_at && Date.parse(x.resets_at) <= Date.now(), p = gone ? 0 : Math.round(x.percent || 0), row = box.appendChild(el("div", "lim"));
      var who = row.appendChild(el("div", "who", nameOf(x)));
      if (x.severity && x.severity !== "normal") who.appendChild(el("span", "chip " + x.severity, x.severity));
      who.appendChild(el("small", "", x.resets_at ? "resets " + when(x.resets_at) : ""));
      var m = row.appendChild(el("div", "meter" + level(p, x.severity))); m.appendChild(el("i")); grow(m, p);
      row.appendChild(el("b", "", p + "%"));
    });
    if (!list.some(function (x) { return x.scope || !/^(session|weekly_all)$/.test(x.kind); }))
      box.appendChild(el("div", "note", "No model-specific limits on your plan right now. When there are some (Fable, Opus…), each gets its own row here."));
  }

  function drawCredits(u) {
    var box = $("credits"), c = u.credits; box.innerHTML = "";
    if (!c) { box.appendChild(el("div", "note", "No usage credits on this account.")); return; }
    var dp = c.decimal_places == null ? 2 : c.decimal_places, cur = c.currency || "USD";
    var money = function (minor) { return (minor / Math.pow(10, dp)).toLocaleString([], { style: "currency", currency: cur }); };
    var row = box.appendChild(el("div", "credits"));
    row.appendChild(el("div", "big", money(c.used_credits || 0)));
    row.appendChild(el("span", "", c.monthly_limit ? "used of " + money(c.monthly_limit) + " this month" : "used · no monthly cap"));
    // a remaining balance only exists on prepaid accounts; otherwise credits are charged as they're used
    var bal = c.balance && typeof c.balance === "object" ? c.balance.amount_minor : c.balance;
    box.appendChild(el("div", "note", bal != null ? money(+bal) + " left" + (c.auto_reload ? " · tops up automatically" : "")
      : "No prepaid balance: credits are charged as you use them."));
    box.appendChild(el("div", "note", c.spend_limit_reached ? "You've reached your credit limit." :
      c.is_enabled ? "On: when you hit a plan limit, Claude keeps going on credits." : "Off: Claude stops at your plan limits."));
  }

  // where this week went: Claude Code, chats, Cowork, other, in a fixed colour order
  var PART_COLORS = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)"];
  function drawSplit(u) {
    var rows = (u.breakdown || []).slice(0, 4), split = $("split"), keys = $("keys");
    split.innerHTML = ""; keys.innerHTML = "";
    if (!rows.length) { keys.appendChild(el("div", "note", "No breakdown for this week yet.")); return; }
    rows.forEach(function (r, i) {
      if (r.percent > 0) { var seg = split.appendChild(el("i")); seg.style.flex = r.percent; seg.style.background = PART_COLORS[i]; }
      var k = keys.appendChild(el("div")); var dot = k.appendChild(el("i")); dot.style.background = PART_COLORS[i];
      k.appendChild(el("span", "", r.display_name));
      var b = k.appendChild(el("b", "", r.percent + "%")); b.appendChild(el("small", "", r.percent_of_limit + "% of limit"));
    });
  }

  // the 7-day chart: week % and 5-hour % on one 0-100 scale; tap or drag across it to read a moment
  function pct(v) { return v == null ? "–" : Math.round(v) + "%"; }
  function drawChart(hist) {
    var box = $("chart"), W = box.clientWidth, H = box.clientHeight, padL = 34, padB = 22, now = Date.now() / 1000, from = now - 7 * 86400;
    var pts = hist.filter(function (h) { return h.t >= from; });
    box.querySelectorAll("svg, .empty").forEach(function (n) { n.remove(); });
    if (pts.length < 1) {
      box.appendChild(el("div", "empty", "The chart fills in as the helper collects your usage, a point every 5 minutes. Check back in a few hours."));
      return;
    }
    var x = function (t) { return padL + (t - from) / (now - from) * (W - padL - 8); }, y = function (p) { return (H - padB) - (p / 100) * (H - padB - 6); };
    var svg = "<g class='grid'>", axis = "<g class='axis'>";
    [0, 25, 50, 75, 100].forEach(function (p) { svg += "<line x1='" + padL + "' x2='" + W + "' y1='" + y(p) + "' y2='" + y(p) + "'/>"; axis += "<text x='" + (padL - 6) + "' y='" + (y(p) + 4) + "' text-anchor='end'>" + p + "</text>"; });
    for (var d = 0; d <= 7; d++) {
      var t = new Date((from + d * 86400) * 1000); t.setHours(0, 0, 0, 0); var tx = t / 1000;
      if (tx >= from && tx <= now) axis += "<text x='" + x(tx) + "' y='" + (H - 4) + "' text-anchor='middle'>" + t.toLocaleDateString([], { weekday: "short" }) + "</text>";
    }
    svg += "</g>" + axis + "</g>";
    // a gap of more than 30 min (PC asleep) breaks the line instead of drawing a straight jump
    function line(key, color) {
      var d = "", last = null;
      var dots = "", run = [];
      function endRun() { if (run.length === 1) dots += "<circle r='3.5' fill='" + color + "' cx='" + run[0][0] + "' cy='" + run[0][1] + "'/>"; run = []; }
      pts.forEach(function (h) {
        if (h[key] == null) { last = null; endRun(); return; }
        var joined = last && h.t - last < 1800, px = x(h.t).toFixed(1), py = y(h[key]).toFixed(1);
        if (!joined) endRun();
        d += (joined ? "L" : "M") + px + "," + py; run.push([px, py]); last = h.t;
      });
      endRun();
      return "<path class='ln' stroke='" + color + "' d='" + d + "'/>" + dots;
    }
    svg += line("s", "var(--s2)") + line("w", "var(--s1)") + "<line class='cross' id='cross' y1='0' y2='" + (H - padB) + "' style='display:none'/>";
    box.insertAdjacentHTML("afterbegin", "<svg viewBox='0 0 " + W + " " + H + "'>" + svg + "</svg>");
    var tip = $("tip"), cross = $("cross");
    function show(e) {
      var r = box.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * W, t = from + (px - padL) / (W - padL - 8) * (now - from), best = pts[0];
      pts.forEach(function (h) { if (Math.abs(h.t - t) < Math.abs(best.t - t)) best = h; });
      var bx = x(best.t);
      cross.setAttribute("x1", bx); cross.setAttribute("x2", bx); cross.style.display = "";
      tip.innerHTML = new Date(best.t * 1000).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" }) +
        "<br><i style='background:var(--s1)'></i>This week " + pct(best.w) + "<br><i style='background:var(--s2)'></i>5-hour " + pct(best.s);
      tip.style.display = "block"; tip.style.top = "8px";
      tip.style.left = Math.max(0, Math.min(box.clientWidth - tip.offsetWidth - 4, bx + 12)) + "px";
    }
    box.onpointerdown = box.onpointermove = function (e) { if (e.type === "pointerdown" || e.buttons) show(e); };
    box.onpointerup = box.onpointerleave = function () { setTimeout(function () { tip.style.display = "none"; cross.style.display = "none"; }, 1500); };
  }

  function get(path) {
    var stop = new AbortController(); setTimeout(function () { stop.abort(); }, 6000);
    return fetch(DECK.pc + path + "?k=" + encodeURIComponent(DECK.key), { signal: stop.signal }).then(function (r) { if (!r.ok) throw r; return r.json(); });
  }
  function load() {
    get("/usage").then(function (u) {
      if (!u.updated) throw u;
      show(u);
      try { localStorage.setItem("deckUsage", JSON.stringify(u)); } catch (e) {}
    }).catch(function () {
      var u; try { u = JSON.parse(localStorage.getItem("deckUsage")); } catch (e) {}
      if (u) show(u, true); else $("side").textContent = "Can't reach your PC";
    });
    get("/usagehistory").then(drawChart, function () { drawChart([]); });
  }
  function show(u, old) {
    // the PC checks with Anthropic every 2 minutes (every 30 s while Claude Code works) and sends it here straight away
    var upd = new Date(u.updated), t = function (d) { return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); };
    var late = Date.now() > +upd + 5 * 60000;
    $("side").textContent = (old ? "PC not reached · " : "") + "Updated " + t(upd) +
      (late ? " · " + inText(Date.now() - upd) + " ago (the PC may be asleep)" : old ? "" : " · live");
    drawNow(u); drawLimits(u); drawCredits(u); drawSplit(u);
  }
  load(); setInterval(load, 60000);  // backup for the live link
  if (window.EventSource) new EventSource(DECK.pc + "/usagestream?k=" + encodeURIComponent(DECK.key)).onmessage = function (e) {
    try {
      var u = JSON.parse(e.data);
      if (!u.updated) return;
      show(u);
      try { localStorage.setItem("deckUsage", JSON.stringify(u)); } catch (x) {}
      get("/usagehistory").then(drawChart, function () {});
    } catch (x) {}
  };

  // same fit as the deck: designed at 1280x800, shrunk to the Echo's screen
  function fit() {
    var s = document.body.style, z = Math.min(innerWidth / 1280, innerHeight / 800);
    s.zoom = z < 1 ? z : ""; s.width = z < 1 ? "1280px" : ""; s.height = z < 1 ? "800px" : "";
  }
  fit(); addEventListener("resize", fit);
</script>
</body>
</html>
