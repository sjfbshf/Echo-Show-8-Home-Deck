<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;500;650&display=swap" rel="stylesheet">
<!-- both made by sync_echo.py: config.js has the PC address and key, pads.js the pads from pads.json -->
<script src="config.js"></script>
<script src="pads.js"></script>
<style>
  /* "Control desk" layout: two trays of keys on top (Echo apps left, PC apps right, an open gap between them),
     the clock bottom left and the PC's media keys bottom right.
     Earlier looks: index-night-console.html (clock dial in the middle) and index-classic.html. */
  :root {
    --bg: #070b12;
    --card: #0e1520;
    --line: rgba(160, 190, 230, 0.12);
    --text: #eef2f8;
    --dim: #7f8aa0;
    --accent: #f2b84b;   /* warm amber: the one "live" colour */
    --ok: #5fd39a;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.04) 0 1px, transparent 1.5px) 0 0 / 46px 46px,
      radial-gradient(ellipse at 50% 40%, #0d1524 0%, var(--bg) 70%);
    color: var(--text);
    font-family: "Sora", "Segoe UI", Roboto, system-ui, sans-serif;
    /* 800 = 32 + 492 (trays) + 24 + 220 (bottom panels) + 32.
       minmax(0, ...) keeps the page no wider than the screen before fit() runs (a wider page makes fit() under-zoom) */
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-rows: minmax(0, 492px) minmax(0, 220px);
    gap: 24px;
    padding: 32px;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }

  /* trays: a sunken plate holding a 2x2 block of keys */
  .tray {
    display: grid; grid-template-columns: repeat(2, 184px); grid-template-rows: repeat(2, 184px); gap: 30px; align-self: center;
    padding: 26px; border-radius: 32px;
    background: rgba(4, 7, 12, .55);
    border: 1px solid var(--line);
    box-shadow: inset 0 2px 14px rgba(0,0,0,.55);
  }
  .tray.echo { justify-self: start; }
  .tray.pc { justify-self: end; }

  .pad {
    display: flex; align-items: center; justify-content: center;
    border-radius: 24px;
    background: linear-gradient(170deg, #142031, var(--card));
    border: 1px solid var(--line);
    box-shadow: 0 10px 22px -14px #000, inset 0 1px 0 rgba(255,255,255,.05);
    color: var(--text); text-decoration: none;
    transition: transform .15s ease, box-shadow .25s ease, border-color .25s ease;
    animation: arrive .6s cubic-bezier(.2,.8,.2,1) both;
    animation-delay: var(--delay, 0s);
  }
  @keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.96); } }
  .pad img { width: 124px; height: 124px; object-fit: contain; filter: drop-shadow(0 6px 14px rgba(0,0,0,.45)); pointer-events: none; }
  .pad img[src*="meteocons"] { transform: scale(1.18); }  /* weather icons have built-in padding */
  .pad:active, .pad.hit { transform: scale(.95); border-color: var(--c); box-shadow: 0 0 0 1px var(--c), 0 0 30px -8px var(--c); }
  .pad:focus-visible { outline: 3px solid var(--c); outline-offset: 3px; }
  button.pad { font: inherit; cursor: pointer; }

  .panel {
    position: relative; border-radius: 28px; padding: 26px 32px;
    background: linear-gradient(170deg, rgba(18,27,40,.9), rgba(14,21,32,.9));
    border: 1px solid var(--line); overflow: hidden;
  }

  /* clock: time, date, and a thin amber line that fills over each minute */
  .clock { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .time { font-size: 112px; font-weight: 300; letter-spacing: -.04em; line-height: 1; white-space: nowrap; }
  .time small { font-size: 30px; letter-spacing: .04em; color: var(--dim); margin-left: 10px; }
  .date { font-size: 20px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin-top: 10px; }
  .soon { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
  .soon span { font-size: 19px; padding: 8px 16px; border-radius: 16px; color: var(--accent); background: rgba(242,184,75,.08); border: 1px solid rgba(242,184,75,.3); white-space: nowrap; }
  .minute { position: absolute; left: 32px; right: 32px; bottom: 16px; height: 3px; border-radius: 2px; background: var(--line); }
  .minute i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 2px; background: var(--accent); box-shadow: 0 0 8px rgba(242,184,75,.6); transition: width .9s linear; }

  /* now playing: what the PC is playing (cover, title, a progress line) with its keys under it.
     The cover's colours glow faintly behind the card. Only the keys the playing app supports are shown. */
  .media { display: grid; grid-template-columns: 156px minmax(0, 1fr); gap: 20px; padding: 22px; }
  .media .glow { position: absolute; inset: -40px; background: center / cover no-repeat; filter: blur(40px) saturate(1.4); opacity: 0; transition: opacity 1s ease; pointer-events: none; }
  .media.has-art .glow { opacity: .28; }
  .art { position: relative; width: 156px; height: 156px; align-self: center; border-radius: 20px; overflow: hidden;
         background: linear-gradient(160deg, #1a2740, #0f1826); border: 1px solid var(--line); box-shadow: 0 14px 30px -16px #000; }
  .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .5s ease; }
  .media.has-art .art img { opacity: 1; }
  .art svg { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px; color: var(--dim); }
  .np { position: relative; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 7px; }
  .np .from { display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); height: 16px; }
  .np .title { font-size: 23px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np .who { font-size: 16px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -3px; }
  /* three little level bars that bounce while it plays and rest when paused */
  .lv { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
  .lv i { width: 3px; height: 4px; border-radius: 1px; background: var(--accent); }
  .media.playing .lv i { animation: lv .9s ease-in-out infinite alternate; }
  .media.playing .lv i:nth-child(2) { animation-duration: .7s; animation-delay: -.3s; }
  .media.playing .lv i:nth-child(3) { animation-duration: 1.1s; animation-delay: -.6s; }
  @keyframes lv { from { height: 3px; } to { height: 12px; } }
  .prog { height: 5px; border-radius: 3px; background: rgba(160,190,230,.12); overflow: hidden; margin-top: 4px; }
  .prog i { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, var(--accent), #ffd98a); transition: width .3s linear; }
  .times { display: flex; justify-content: space-between; font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; margin-top: -2px; }
  .media.idle .prog, .media.idle .times, .media.no-time .prog, .media.no-time .times { visibility: hidden; }
  .keys { display: flex; gap: 10px; margin-top: 2px; }
  .key[hidden] { display: none; }
  .keys .key { flex: 1; width: auto; }  /* the keys share the row, however many the app allows */
  .keys .key.main { flex: 1.4; }
  .key text { font: 650 6.4px Sora, sans-serif; fill: currentColor; stroke: none; text-anchor: middle; }
  .key {
    width: 62px; height: 50px; border-radius: 15px; border: 1px solid var(--line); cursor: pointer; touch-action: none;
    background: linear-gradient(170deg, #17243a, #101a28); color: var(--text);
    display: flex; align-items: center; justify-content: center;
    transition: transform .12s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .key svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  .key .solid { fill: currentColor; stroke: none; }
  .key.main { width: 78px; color: var(--accent); border-color: rgba(242,184,75,.35); }
  /* the progress line: tap it to jump there (when the app allows it) */
  .seekable { padding: 9px 0; margin: -9px 0; cursor: pointer; }
  .media.can-seek .prog { height: 7px; }
  .key.main .pause { display: none; }
  .media.playing .key.main .pause { display: block; }
  .media.playing .key.main .play { display: none; }
  .key:active, .key.hit { transform: scale(.95); border-color: var(--accent); box-shadow: 0 0 24px -8px var(--accent); }

  /* status badge in the gap between the trays; only shows when there is news */
  .status {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%); white-space: nowrap; max-width: none;
    max-width: 210px; padding: 8px 14px; border-radius: 16px; text-align: center;
    font-size: 14px; line-height: 1.35; border: 1px solid transparent; color: var(--dim);
    opacity: 0; transition: opacity .25s ease;
  }
  .status.show { opacity: 1; }
  .status.ok { color: var(--ok); border-color: rgba(95,211,154,.35); background: rgba(95,211,154,.08); }
  .status.bad { color: var(--bad); border-color: rgba(255,107,107,.35); background: rgba(255,107,107,.08); }

  /* Claude usage, standing in the gap between the trays: two meters, each with its percent and when it resets */
  .usage {
    position: absolute; top: 53px; left: 50%; transform: translateX(-50%); width: 272px; height: 450px;
    display: flex; flex-direction: column; gap: 16px; padding: 24px 22px;
    border-radius: 28px; border: 1px solid var(--line);
    background: linear-gradient(170deg, rgba(18,27,40,.9), rgba(14,21,32,.9));
    --claude: #d97757;
  }
  .usage h2 { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
  .usage h2 img { width: 22px; height: 22px; }
  .meter { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
  .meter .name { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
  .meter .pct { font-size: 58px; font-weight: 300; letter-spacing: -.03em; line-height: 1; }
  .meter .pct small { font-size: 24px; color: var(--dim); margin-left: 2px; }
  .meter .bar { height: 10px; border-radius: 5px; background: rgba(160,190,230,.1); overflow: hidden; }
  .meter .bar i { display: block; height: 100%; width: 0; border-radius: 5px; background: var(--claude); transition: width .8s ease; }
  .meter.high .bar i { background: var(--bad); }
  .meter .reset { font-size: 15px; color: var(--text); }
  .meter .reset span { display: block; font-size: 13px; color: var(--dim); margin-top: 3px; }
  .usage .old { font-size: 12px; color: var(--dim); text-align: center; min-height: 15px; }

  @media (prefers-reduced-motion: reduce) { .pad, .key, .minute i, .status { transition: none; animation: none; } }
</style>
</head>
<body>

<div class="tray echo" id="left" aria-label="On this screen"></div>
<div class="tray pc" id="right" aria-label="On my PC"></div>

<section class="usage" aria-label="Claude usage">
  <h2><img src="https://api.iconify.design/logos/claude-icon.svg" alt="">Claude usage</h2>
  <div class="meter" id="u5"><div class="name">5-hour</div><div class="pct">--<small>%</small></div><div class="bar"><i></i></div><div class="reset"></div></div>
  <div class="meter" id="uw"><div class="name">Weekly</div><div class="pct">--<small>%</small></div><div class="bar"><i></i></div><div class="reset"></div></div>
  <div class="old" id="uOld"></div>
</section>

<section class="panel clock">
  <div>
    <div class="time" id="time">--:--</div>
    <div class="date" id="date"></div>
  </div>
  <div class="soon" id="soon"></div>
  <div class="minute"><i id="minute"></i></div>
</section>

<section class="panel media idle" id="media" aria-label="Playing on your PC">
  <div class="glow" id="glow"></div>
  <div class="art"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg><img id="art" alt=""></div>
  <div class="np">
    <div class="from"><span class="lv"><i></i><i></i><i></i></span><span id="npFrom">Your PC</span></div>
    <div class="title" id="npTitle">Nothing playing</div>
    <div class="who" id="npWho">Play something on your PC</div>
    <div class="seekable" id="npSeek"><div class="prog"><i id="npBar"></i></div></div>
    <div class="times"><span id="npAt">0:00</span><span id="npLeft">0:00</span></div>
    <div class="keys">
      <button class="key" id="npPrev" aria-label="Previous track"><svg viewBox="0 0 24 24"><path class="solid" d="M18 6v12l-9-6z"/><path d="M6 6v12"/></svg></button>
      <button class="key" id="npBack" aria-label="Back 10 seconds"><svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.6-5.7"/><path d="M6.5 2.5v4h4"/><text x="12.6" y="15.4">10</text></svg></button>
      <button class="key main" data-key="play" aria-label="Play or pause"><svg class="play" viewBox="0 0 24 24"><path class="solid" d="M7 4.5v15l12-7.5z"/></svg><svg class="pause" viewBox="0 0 24 24"><path class="solid" d="M6 4.5h4v15H6zM14 4.5h4v15h-4z"/></svg></button>
      <button class="key" id="npFwd" aria-label="Forward 10 seconds"><svg viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.6-5.7"/><path d="M17.5 2.5v4h-4"/><text x="11.4" y="15.4">10</text></svg></button>
      <button class="key" id="npNext" aria-label="Next track"><svg viewBox="0 0 24 24"><path class="solid" d="M6 6v12l9-6z"/><path d="M18 6v12"/></svg></button>
    </div>
  </div>
</section>

<div class="status" id="status" role="status"></div>

<script>
  // This page lives on the Echo; edit pads.json on the PC, then run sync_echo.py.
  var DECK = window.DECK || {};
  var statusEl = document.getElementById("status");

  function say(text, kind) {
    statusEl.textContent = text;
    statusEl.className = "status show " + (kind || "");
    clearTimeout(say.t);
    say.t = setTimeout(function () { statusEl.className = "status"; }, 3000);
  }

  // ask the PC helper to do something; a PC that's off never answers, so give up after 4 s
  function pc(path) {
    var stop = new AbortController(); setTimeout(function () { stop.abort(); }, 4000);
    return fetch(DECK.pc + path + "?k=" + encodeURIComponent(DECK.key), { method: "POST", signal: stop.signal })
      .then(function (r) { if (!r.ok) { say("PC said no (" + r.status + ")", "bad"); throw r; } return r; },
            function (e) { say("Can't reach your PC. Is it on?", "bad"); throw e; });
  }

  function makePad(p, el, i) {
    el.className = "pad";
    el.style.setProperty("--c", p.c);
    el.style.setProperty("--delay", (0.06 * i) + "s");
    el.setAttribute("aria-label", p.name);  // the name is never shown, only read out by screen readers
    var img = document.createElement("img");
    img.src = p.icon;  // shortcut: logos load from api.iconify.design, so they need internet
    img.alt = "";
    el.appendChild(img);
    el.addEventListener("touchstart", function () { el.classList.add("hit"); }, { passive: true });
    el.addEventListener("touchend", function () { setTimeout(function () { el.classList.remove("hit"); }, 150); });
    el.addEventListener("animationend", function () { el.style.animation = "none"; });  // let :active transforms work after arriving
    return el;
  }

  (function (pads) {
    ["left", "right"].forEach(function (side, s) {
      var tray = document.getElementById(side);
      pads[side].slice(0, 4).forEach(function (p, i) {  // shortcut: each tray has room for 4 pads
        var el;
        if (p.pc) {
          el = makePad(p, document.createElement("button"), i + 4 * s);
          el.type = "button";
          el.addEventListener("click", function () { pc("/run/" + encodeURIComponent(p.id)).then(function () { say("Opened on your PC", "ok"); }, function () {}); });
        } else {
          el = makePad(p, document.createElement("a"), i + 4 * s);
          el.href = p.url;  // same tab; local pages like timer.html sit next to this file
        }
        tray.appendChild(el);
      });
    });
  })(window.PADS || { left: [], right: [] });

  // media keys: each tap presses that key on the PC (Windows sends it to YouTube, Spotify, etc.);
  // holding a volume key repeats it (each press is about 2% on Windows)
  Array.prototype.forEach.call(document.querySelectorAll(".key[data-key]"), function (b) {
    var path = "/key/" + b.dataset.key, rep, wait;
    function press() { pc(path).catch(release); }
    function release() { clearTimeout(wait); clearInterval(rep); b.classList.remove("hit"); }
    b.addEventListener("pointerdown", function () {
      b.classList.add("hit"); press();
      if (b.hasAttribute("data-hold")) wait = setTimeout(function () { rep = setInterval(press, 120); }, 400);
    });
    ["pointerup", "pointerleave", "pointercancel"].forEach(function (ev) { b.addEventListener(ev, release); });
  });

  // now playing: asks the PC helper every second what Windows says is playing, and moves the line between asks
  var NP = null, npAt = 0, npArt = -1, mediaEl = document.getElementById("media");
  function mmss(s) { s = Math.max(0, Math.floor(s)); var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + ":" + ("0" + m).slice(-2) : m) + ":" + ("0" + s % 60).slice(-2); }
  function appName(id) {  // Windows gives an app id like "Brave.ABC123" or "Spotify.exe"
    var known = { spotify: "Spotify", chrome: "Chrome", brave: "Brave", msedge: "Edge", firefox: "Firefox", zunemusic: "Media Player", vlc: "VLC", opera: "Opera", applemusic: "Apple Music", discord: "Discord" };
    var low = (id || "").toLowerCase();
    for (var k in known) if (low.indexOf(k) >= 0) return known[k];
    return (id || "Your PC").split(/[.!_]/)[0];
  }
  function drawNow() {
    var n = NP, on = n && n.title;
    mediaEl.classList.toggle("idle", !on);
    mediaEl.classList.toggle("playing", !!(on && n.playing));
    document.getElementById("npTitle").textContent = on ? n.title : "Nothing playing";
    document.getElementById("npWho").textContent = on ? (n.artist || n.album || " ") : "Play something on your PC";
    document.getElementById("npFrom").textContent = on ? appName(n.app) + (n.playing ? "" : " · paused") : "Your PC";
    if (on && n.length > 0) {
      var at = Math.min(n.length, n.position + (n.playing ? (Date.now() - npAt) / 1000 : 0));
      document.getElementById("npBar").style.width = (at / n.length * 100) + "%";
      document.getElementById("npAt").textContent = mmss(at);
      document.getElementById("npLeft").textContent = "-" + mmss(n.length - at);
    } else if (on && n.keys) {  // Spotify read from its window title: no times
      document.getElementById("npBar").style.width = "0";
      document.getElementById("npAt").textContent = document.getElementById("npLeft").textContent = "";
    } else if (on) {  // live streams and some apps don't say how long
      document.getElementById("npBar").style.width = "0";
      document.getElementById("npAt").textContent = n.playing ? "Live" : "";
      document.getElementById("npLeft").textContent = "";
    }
    // only the keys the app supports: YouTube has no next/previous outside a playlist, but lets you jump around
    document.getElementById("npPrev").hidden = !(on && n.prev);
    document.getElementById("npNext").hidden = !(on && n.next);
    var seek = !!(on && n.seek && n.length > 0);
    document.getElementById("npBack").hidden = document.getElementById("npFwd").hidden = !seek;
    mediaEl.classList.toggle("can-seek", seek);
    mediaEl.classList.toggle("no-time", !!(on && n.keys));
    var art = on ? n.art : 0;
    if (art !== npArt) {
      npArt = art;
      var src = art ? DECK.pc + "/art?k=" + encodeURIComponent(DECK.key) + "&v=" + art : "";
      mediaEl.classList.remove("has-art");
      var img = document.getElementById("art");
      if (src) { img.onload = function () { mediaEl.classList.add("has-art"); }; img.src = src; document.getElementById("glow").style.backgroundImage = "url('" + src + "')"; }
      else img.removeAttribute("src");
    }
  }
  function loadNow() {
    if (document.hidden) return;
    var stop = new AbortController(); setTimeout(function () { stop.abort(); }, 2500);
    fetch(DECK.pc + "/nowplaying?k=" + encodeURIComponent(DECK.key), { signal: stop.signal })
      .then(function (r) { if (!r.ok) throw r; return r.json(); })
      .then(function (n) { NP = n; npAt = Date.now(); drawNow(); })
      .catch(function () { NP = null; drawNow(); });  // PC off or asleep: show "Nothing playing"
  }
  loadNow(); setInterval(loadNow, 1000); setInterval(drawNow, 250);
  // skip and jump: sent to the PC helper, which passes them to Windows' media controls
  function npSend(path) {
    var stop = new AbortController(); setTimeout(function () { stop.abort(); }, 4000);
    fetch(DECK.pc + path + (path.indexOf("?") < 0 ? "?" : "&") + "k=" + encodeURIComponent(DECK.key), { method: "POST", signal: stop.signal }).catch(function () {});
  }
  function npNow() { return NP.position + (NP.playing ? (Date.now() - npAt) / 1000 : 0); }
  function jumpTo(t) {  // moves the line straight away; the next ask confirms it
    if (!NP || !NP.seek) return;
    t = Math.max(0, Math.min(NP.length - 1, t));
    NP.position = t; npAt = Date.now(); drawNow();
    npSend("/np/seek?to=" + t.toFixed(1));
  }
  document.getElementById("npBack").onclick = function () { jumpTo(npNow() - 10); };
  document.getElementById("npFwd").onclick = function () { jumpTo(npNow() + 10); };
  // Spotify read from its window title ("keys") is skipped with the PC's media keys; the rest through Windows' media list
  document.getElementById("npPrev").onclick = function () { npSend(NP && NP.keys ? "/key/prev" : "/np/prev"); };
  document.getElementById("npNext").onclick = function () { npSend(NP && NP.keys ? "/key/next" : "/np/next"); };
  document.getElementById("npSeek").onclick = function (e) {
    var bar = this.querySelector(".prog"), r = bar.getBoundingClientRect();
    if (NP && NP.length > 0) jumpTo((e.clientX - r.left) / r.width * NP.length);
  };
  ["npBack", "npFwd", "npPrev", "npNext"].forEach(function (id) {
    var b = document.getElementById(id);
    b.addEventListener("pointerdown", function () { b.classList.add("hit"); });
    ["pointerup", "pointerleave", "pointercancel"].forEach(function (ev) { b.addEventListener(ev, function () { b.classList.remove("hit"); }); });
  });

  // tapping play/pause flips the button straight away; the next ask confirms it
  document.querySelector(".key.main").addEventListener("click", function () { if (NP && NP.title) { NP.position += NP.playing ? (Date.now() - npAt) / 1000 : 0; npAt = Date.now(); NP.playing = !NP.playing; drawNow(); } });

  // The deck is designed at 1280x800; shrink it to fit screens that report fewer CSS pixels (the Echo reports ~853x533).
  function fit() {
    var s = document.body.style;
    var z = Math.min(innerWidth / 1280, innerHeight / 800);
    s.zoom = z < 1 ? z : "";
    s.width = z < 1 ? "1280px" : "";
    s.height = z < 1 ? "800px" : "";
  }
  fit();
  addEventListener("resize", fit);

  // timer and alarm keep running here after leaving the timer page
  var alarmJs = document.createElement("script");
  alarmJs.src = "alarm.js";
  document.body.appendChild(alarmJs);

  function clockText(mins) { var h = Math.floor(mins / 60), m = mins % 60; return (h % 12 || 12) + ":" + (m < 10 ? "0" : "") + m + (h < 12 ? " AM" : " PM"); }
  function tick() {
    var d = new Date(), t = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    var ampm = (/\s?([AP]M)$/i.exec(t) || [])[1];
    document.getElementById("time").innerHTML = t.replace(/\s?[AP]M$/i, "") + (ampm ? "<small>" + ampm + "</small>" : "");
    document.getElementById("date").textContent = d.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
    var s = d.getSeconds(), bar = document.getElementById("minute");
    bar.style.transition = s === 0 ? "none" : "";
    bar.style.width = (s / 59 * 100) + "%";
    // a running timer or a set alarm shows next to the clock
    var A = window.Alarm && window.Alarm.S, soon = [];
    if (A && A.tEnd) { var left = Math.max(0, Math.round((A.tEnd - Date.now()) / 1000)); soon.push("Timer " + Math.floor(left / 60) + ":" + ("0" + left % 60).slice(-2)); }
    if (A && A.aOn) soon.push("Alarm " + clockText(A.aMin));
    document.getElementById("soon").innerHTML = soon.map(function (x) { return "<span>" + x + "</span>"; }).join("");
  }
  // Claude usage comes from the PC helper (usage.json there); the countdowns tick here between updates
  var USAGE = null;
  function inText(ms) {
    var m = Math.max(0, Math.round(ms / 60000)), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60);
    return d ? d + "d " + h + "h" : h ? h + "h " + (m % 60) + "m" : (m % 60) + "m";
  }
  function whenText(t) {
    var d = new Date(Math.round(Date.parse(t) / 60000) * 60000), time = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    return d.toDateString() === new Date().toDateString() ? time : d.toLocaleDateString([], { weekday: "short" }) + " " + time;
  }
  function drawMeter(id, w) {
    var box = document.getElementById(id), now = Date.now();
    if (!w) return;
    var gone = w.resets_at && Date.parse(w.resets_at) <= now, pct = gone ? 0 : Math.round(w.percent);  // past the reset: back to 0
    box.className = "meter" + (pct >= 80 ? " high" : "");
    box.querySelector(".pct").innerHTML = pct + "<small>%</small>";
    box.querySelector(".bar i").style.width = Math.min(100, pct) + "%";
    // no reset time = no window running (nothing used since the last one ended)
    box.querySelector(".reset").innerHTML = !w.resets_at ? "Not started<span>starts when you next use Claude</span>"
      : gone ? "Reset" : "Resets " + whenText(w.resets_at) + "<span>in " + inText(Date.parse(w.resets_at) - now) + "</span>";
  }
  function drawUsage() {
    if (!USAGE) return;
    drawMeter("u5", USAGE.five_hour); drawMeter("uw", USAGE.weekly);
    var age = Date.now() - Date.parse(USAGE.updated);
    document.getElementById("uOld").textContent = age > 15 * 60000 ? "Last checked " + inText(age) + " ago" : "";
  }
  function loadUsage() {
    var stop = new AbortController(); setTimeout(function () { stop.abort(); }, 4000);
    fetch(DECK.pc + "/usage?k=" + encodeURIComponent(DECK.key), { signal: stop.signal })
      .then(function (r) { if (!r.ok) throw r; return r.json(); })
      .then(function (u) { if (u.updated) { USAGE = u; localStorage.setItem("deckUsage", JSON.stringify(u)); } drawUsage(); })
      .catch(function () { drawUsage(); });  // PC off: keep showing the last numbers with their age
  }
  try { USAGE = JSON.parse(localStorage.getItem("deckUsage")); } catch (e) {}
  // "claude_usage": false in settings.json hides the panel
  if (DECK.usage === false) document.querySelector(".usage").style.visibility = "hidden";
  else { loadUsage(); setInterval(loadUsage, 60000); }

  tick();
  setInterval(function () { tick(); if (new Date().getSeconds() === 0) drawUsage(); }, 1000);
</script>
</body>
</html>
